<!doctype html><meta charset="utf-8">
<style>
  html, body { margin: 0; background: #fff; }
  body { box-sizing: border-box; width: 1200px; height: 630px; display: flex; align-items: center; gap: 56px; padding: 0 64px 0 80px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1d2226; -webkit-font-smoothing: antialiased; }
  .copy { flex: 1; }
  .brand { display: flex; align-items: center; gap: 14px; margin: 0 0 30px; font-size: 30px; font-weight: 700; }
  .brand img { width: 52px; height: 52px; border-radius: 8px; }
  h1 { margin: 0 0 18px; font-size: 54px; line-height: 1.08; letter-spacing: -.025em; }
  p { margin: 0; font-size: 22px; line-height: 1.45; color: #55595e; }
  iframe { flex: none; width: 480px; border: 0; border-radius: 10px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 14px 36px rgba(16,24,40,.18); }
</style>
<div class="copy">
  <div class="brand"><img src="{{EXT}}/icons/icon128.png" alt="">Unlinked</div>
  <h1>See only the people you follow on LinkedIn.</h1>
  <p>A free Chrome extension that hides ads, suggestions and filler.</p>
</div>
<iframe src="{{POPUP}}" style="height: {{POPUP_H}}px" title=""></iframe>
